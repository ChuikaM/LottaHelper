services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./:/lottahelper
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    build: .
    env_file:
      - .env
    # NOTE: The same .env file is used here. It should include, at minimum:
     #   - CELERY_BROKER_URL      (e.g., redis://redis:6379/0)
     #   - CELERY_RESULT_BACKEND  (e.g., redis://redis:6379/1)
     #   - DATABASE_URL           (if Celery tasks access the database)
     #   - OPENAI_API_KEY         (if tasks call OpenAI)
    command: celery -A app._celery.celery_app:celery_app worker --loglevel=info --pool=solo --concurrency=1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/lottahelper
    working_dir: /lottahelper

  api:
    build: .
    env_file:
      - .env
    # NOTE: The same .env file is used here. It should include, at minimum:
     #   - CELERY_BROKER_URL      (e.g., redis://redis:6379/0)
     #   - CELERY_RESULT_BACKEND  (e.g., redis://redis:6379/1)
     #   - DATABASE_URL           (if Celery tasks access the database)
     #   - OPENAI_API_KEY         (if tasks call OpenAI)
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/lottahelper
    working_dir: /lottahelper
    command: gunicorn -c app/gunicorn/gunicorn.conf.py main:app

volumes:
  redis_data:

networks:
  proxy-network:
    driver: bridge