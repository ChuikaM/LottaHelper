services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/ssl/fullchain.pem:/etc/ssl/nginx/fullchain.pem:ro
      - ./nginx/ssl/privkey.pem:/etc/ssl/nginx/privkey.pem:ro
    networks:
      - proxy-network
    depends_on:
      api:
        condition: service_healthy 
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: on-failure

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    build: .
    env_file:
      - .env
    command: celery -A app._celery_.celery_app:celery_app worker --loglevel=info --concurrency=4
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/lottahelper
      - cache_volume:/lottahelper/cache
    working_dir: /lottahelper
    networks:
      - proxy-network

  api:
    build: .
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/lottahelper
      - cache_volume:/lottahelper/cache
    expose:
      - "8000"
    working_dir: /lottahelper
    command: gunicorn -c app/_gunicorn_/gunicorn.conf.py main:app
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  redis_data:
  cache_volume:

networks:
  proxy-network:
    driver: bridge