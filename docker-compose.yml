services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/app/data
      - ./.cache:/app/.cache
    command: gunicorn -c app/gunicorn.conf.py main:app

  celery:
    build: .
    environment:
      - .env
    command: celery -A celery_worker worker --loglevel=info --pool=solo --concurrency=1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/app/data
      - ./.cache:/app/.cache

volumes:
  redis_data: