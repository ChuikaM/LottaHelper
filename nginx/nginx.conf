user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid; 

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;           # 📦 Типы файлов (js, css, png...)
    default_type application/octet-stream;   # 📦 Тип по умолчанию

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;  # 📋 Лог запросов

    sendfile on;              # 📤 Эффективная отправка файлов
    tcp_nopush on;            # 📦 Оптимизация пакетов
    tcp_nodelay on;           # ⚡ Отключение задержек Nagle
    keepalive_timeout 65;     # ⏱️ Сколько держать соединение открытым
    types_hash_max_size 2048; # 🗂️ Размер хэш-таблицы типов

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name localhost;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        client_max_body_size 10M;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location /recommendations {
            proxy_pass http://api:8000/recommendations;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://api:8000/health;
            access_log off;
        }
    }
}